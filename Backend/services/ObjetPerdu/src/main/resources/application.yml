spring:
  config:
    import: optional:configserver:http://localhost:8888
  application:
    name: ObjetPerdu-service
  datasource:
    username: root
    #password: med
    url: jdbc:mysql://localhost:3306/ObjetPerdu?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: "http://localhost:9098/realms/JobBoardKeycloack"

server:
  port: 8081
logging:
  level:
    org.springframework: DEBUG
    org.hibernate: DEBUG